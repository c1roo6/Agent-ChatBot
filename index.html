<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentBot - Atención al Cliente 24/7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* TEMA OSCURO (por defecto) */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --gradient-accent: #a78bfa;
            --message-user-bg: #667eea;
            --message-bot-bg: #1e293b;
            --message-bot-border: #475569;
            --input-bg: #1e293b;
            --input-border: #475569;
            --input-focus: #667eea;
            --header-shadow: rgba(0, 0, 0, 0.5);
            --transition: 0.3s ease;
        }

        body.light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border-color: #cbd5e1;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --gradient-accent: #a78bfa;
            --message-user-bg: #667eea;
            --message-bot-bg: #f1f5f9;
            --message-bot-border: #e2e8f0;
            --input-bg: #f1f5f9;
            --input-border: #cbd5e1;
            --input-focus: #667eea;
            --header-shadow: rgba(0, 0, 0, 0.1);
            --transition: 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            height: 80vh;
            max-height: 600px;
        }

        /* SIDEBAR IZQUIERDA */
        .sidebar {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .bot-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .bot-info {
            flex: 1;
        }

        .bot-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .bot-status {
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat {
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .stat:hover {
            border-color: var(--gradient-accent);
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--gradient-accent);
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .conversations-label {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .conversation-item {
            background: var(--bg-tertiary);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid transparent;
            color: var(--text-secondary);
        }

        .conversation-item:hover {
            border-color: var(--border-color);
            background: var(--bg-secondary);
        }

        .conversation-item.active {
            background: var(--gradient-1);
            color: white;
            border-left: 3px solid var(--gradient-accent);
            padding-left: 7px;
        }

        /* CHAT PRINCIPAL */
        .chat-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 4px 20px var(--header-shadow);
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-title .icon {
            font-size: 20px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-primary);
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--gradient-accent);
            color: white;
        }

        .message-content {
            background: var(--message-bot-bg);
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
            border: 1px solid var(--message-bot-border);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            color: white;
            border: none;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            border-bottom-left-radius: 4px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
        }

        /* INPUT */
        .chat-input-container {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            gap: 10px;
            transition: var(--transition);
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 80px;
            transition: var(--transition);
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                max-height: 100%;
            }

            .sidebar {
                display: none;
            }

            .message {
                max-width: 90%;
            }

            .chat-header {
                padding: 16px;
            }

            .chat-messages {
                padding: 16px;
            }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        /* THEME TOGGLE */
        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: var(--transition);
            margin-bottom: 15px;
        }

        .theme-toggle:hover {
            border-color: var(--gradient-accent);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>

            <div class="sidebar-header">
                <div class="bot-avatar">🤖</div>
                <div class="bot-info">
                    <div class="bot-name">AgentBot</div>
                    <div class="bot-status">
                        <span class="status-dot"></span>
                        En línea
                    </div>
                </div>
            </div>

            <button class="new-chat-btn">+ Nueva conversación</button>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="statChats">0</div>
                    <div class="stat-label">Chats</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="statMessages">0</div>
                    <div class="stat-label">Mensajes</div>
                </div>
            </div>

            <div class="conversations-label">Conversaciones</div>
            <div id="conversationsList" style="flex: 1; overflow-y: auto;">
                <div style="color: var(--text-secondary); font-size: 12px; text-align: center; padding-top: 20px; opacity: 0.7;">
                    Sin conversaciones aún
                </div>
            </div>
        </div>

        <!-- CHAT PRINCIPAL -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-title">
                    <span class="icon">💬</span>
                    <span>Soporte 24/7</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Información">ℹ️</button>
                    <button class="icon-btn" title="Más opciones">⋯</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <div>Hola, ¿cómo puedo ayudarte?</div>
                    <div style="font-size: 12px;">Escribe tu pregunta abajo</div>
                </div>
            </div>

            <div class="chat-input-container">
                <input
                    type="text"
                    class="chat-input"
                    id="messageInput"
                    placeholder="Escribe tu mensaje..."
                    onkeypress="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
                >
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">📤</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statChats = document.getElementById('statChats');
        const statMessages = document.getElementById('statMessages');
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let messageCount = 0;
        let chatCount = 1;
        let isFirstMessage = true;
        let isDarkMode = true;

        // Cargar tema guardado
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            isDarkMode = false;
            html.classList.add('light-mode');
            themeToggle.textContent = '☀️';
        }

        // Toggle tema
        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                html.classList.remove('light-mode');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.add('light-mode');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            messageInput.value = '';
            sendBtn.classList.add('loading');

            if (isFirstMessage) {
                chatMessages.innerHTML = '';
                isFirstMessage = false;
            }

            addMessage(message, 'user');
            messageCount++;
            updateStats();

            try {
                // ACTUALIZA ESTA URL CON LA TUYA DE REPLIT
                const response = await fetch(
                    'https://3f2d2637-e888-4686-80a3-a0c1ee1cae57-00-am2d5up6fb9m.picard.replit.dev/api/chat',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mensaje: message })
                    }
                );

                const data = await response.json();

                if (data.respuesta) {
                    addMessage(data.respuesta, 'bot');
                    messageCount++;
                    updateStats();
                } else {
                    addMessage('Error: No recibí respuesta del servidor', 'bot');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage(`Error conectando. Intenta más tarde. (${error.message})`, 'bot');
            } finally {
                sendBtn.classList.remove('loading');
                messageInput.focus();
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateStats() {
            statMessages.textContent = messageCount;
            statChats.textContent = chatCount;
        }

        // Inicializa
        updateStats();
        messageInput.focus();

        // Botón nueva conversación
        document.querySelector('.new-chat-btn').addEventListener('click', () => {
            chatMessages.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">💭</div>
                    <div>Nueva conversación iniciada</div>
                </div>
            `;
            messageCount = 0;
            chatCount++;
            updateStats();
            isFirstMessage = true;
            messageInput.focus();
        });
    </script>
</body>
</html>
