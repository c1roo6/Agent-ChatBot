<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentBot - Atención al Cliente 24/7</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* TEMA OSCURO (por defecto) */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --gradient-accent: #a78bfa;
            --message-user-bg: #667eea;
            --message-bot-bg: #1e293b;
            --message-bot-border: #475569;
            --input-bg: #1e293b;
            --input-border: #475569;
            --input-focus: #667eea;
            --header-shadow: rgba(0, 0, 0, 0.5);
            --transition: 0.3s ease;
            --code-bg: #0f172a;
        }

        body.light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border-color: #cbd5e1;
            --gradient-1: #667eea;
            --gradient-2: #764ba2;
            --gradient-accent: #a78bfa;
            --message-user-bg: #667eea;
            --message-bot-bg: #f1f5f9;
            --message-bot-border: #e2e8f0;
            --input-bg: #f1f5f9;
            --input-border: #cbd5e1;
            --input-focus: #667eea;
            --header-shadow: rgba(0, 0, 0, 0.1);
            --transition: 0.3s ease;
            --code-bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            gap: 0;
        }

        /* HEADER */
        .chat-header {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 4px 20px var(--header-shadow);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 60px;
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-title .icon {
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* CHAT PRINCIPAL */
        .chat-container {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 80px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-primary);
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--gradient-accent);
            color: white;
        }

        .message-content {
            background: var(--message-bot-bg);
            padding: 14px 18px;
            border-radius: 14px;
            word-wrap: break-word;
            line-height: 1.6;
            border: 1px solid var(--message-bot-border);
            color: var(--text-primary);
            transition: var(--transition);
            font-size: 15px;
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            color: white;
            border: none;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            border-bottom-left-radius: 4px;
        }

        /* MARKDOWN STYLES */
        .message-content strong {
            font-weight: 700;
            color: var(--gradient-accent);
        }

        .message-content em {
            font-style: italic;
        }

        .message-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .message-content pre {
            background: var(--code-bg);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid var(--border-color);
        }

        .message-content pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: var(--gradient-accent);
        }

        .message-content ul, .message-content ol {
            margin-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .message-content li {
            margin-bottom: 6px;
        }

        .message-content a {
            color: var(--gradient-accent);
            text-decoration: underline;
            cursor: pointer;
        }

        .message-content a:hover {
            opacity: 0.8;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 500;
        }

        .empty-state-subtext {
            font-size: 14px;
            opacity: 0.7;
        }

        /* INPUT */
        .chat-input-container {
            padding: 16px 20px 20px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            gap: 10px;
            transition: var(--transition);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            min-height: 44px;
            transition: var(--transition);
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn.loading {
            animation: spin 1s linear infinite;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--gradient-accent);
            transform: scale(1.05);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* SCROLLBAR */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--gradient-accent);
        }

        @media (max-width: 768px) {
            .message {
                max-width: 95%;
            }

            .chat-header {
                padding: 12px 16px;
            }

            .chat-messages {
                padding: 70px 12px 12px 12px;
            }

            .message-content {
                font-size: 14px;
            }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- CHAT PRINCIPAL -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-title">
                    <span class="icon">🤖</span>
                    <span>AgentBot - Soporte 24/7</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Información">ℹ️</button>
                    <button class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>
                    <button class="icon-btn" title="Más opciones">⋯</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">¡Bienvenido a AgentBot!</div>
                    <div class="empty-state-subtext">Escribe tu pregunta abajo para comenzar</div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input
                        type="text"
                        class="chat-input"
                        id="messageInput"
                        placeholder="Escribe tu mensaje aquí..."
                        onkeypress="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
                    >
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">📤</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        let isFirstMessage = true;
        let isDarkMode = true;

        // Cargar tema guardado
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            isDarkMode = false;
            html.classList.add('light-mode');
            themeToggle.textContent = '☀️';
        }

        // Toggle tema
        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                html.classList.remove('light-mode');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.add('light-mode');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        });

        // Parsear Markdown básico
        function parseMarkdown(text) {
            let html = text;

            // Escapar HTML especial
            html = html.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;');

            // **bold**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // *italic*
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // _italic_
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');

            // `code`
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // ~~strikethrough~~
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

            // ```code block```
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        // Efecto de escritura gradual
        async function typeMessage(element, text, speed = 30) {
            let index = 0;
            const htmlText = parseMarkdown(text);
            element.innerHTML = '';

            // Simulamos escritura carácter por carácter
            for (let i = 0; i < text.length; i++) {
                element.innerHTML = parseMarkdown(text.substring(0, i + 1));
                await new Promise(resolve => setTimeout(resolve, speed));
                
                // Scroll auto
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Mostrar versión final con markdown
            element.innerHTML = htmlText;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            messageInput.value = '';
            sendBtn.classList.add('loading');

            if (isFirstMessage) {
                chatMessages.innerHTML = '';
                isFirstMessage = false;
            }

            addMessage(message, 'user');

            try {
                // ACTUALIZA ESTA URL CON LA TUYA DE REPLIT
                const response = await fetch(
                    'https://3f2d2637-e888-4686-80a3-a0c1ee1cae57-00-am2d5up6fb9m.picard.replit.dev/api/chat',
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mensaje: message })
                    }
                );

                const data = await response.json();

                if (data.respuesta) {
                    const botMessageDiv = addMessage('', 'bot', true);
                    await typeMessage(botMessageDiv.querySelector('.message-content'), data.respuesta, 20);
                } else {
                    addMessage('Error: No recibí respuesta del servidor', 'bot');
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage(`❌ Error conectando. Intenta más tarde.\n\n${error.message}`, 'bot');
            } finally {
                sendBtn.classList.remove('loading');
                messageInput.focus();
            }
        }

        function addMessage(text, sender, isBot = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (!isBot) {
                // Para mensajes del usuario, parsear markdown directo
                content.innerHTML = parseMarkdown(text);
            } else {
                // Para bot, será llenado por typeMessage
                content.textContent = '';
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        // Auto-resize del input
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Focus inicial
        messageInput.focus();
    </script>
</body>
</html>
